name: Build and publish desktop release

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Private source tag to build (for example v0.1.23)
        required: true
        type: string
      artifacts_run_id:
        description: Optional completed release run with verified artifacts for the exact source commit
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: oneyes-public-release
  cancel-in-progress: false

env:
  SOURCE_REPO: Pan-chongyu/oneyes-desktop
  RELEASE_REPO: Pan-chongyu/oneyes-desktop-releases
  REQUIRED_PLATFORMS: windows-x86_64,darwin-x86_64,darwin-aarch64,linux-x86_64-appimage,linux-x86_64-deb,linux-x86_64-rpm

jobs:
  prepare:
    name: Resolve private source release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      build: ${{ steps.source.outputs.build }}
      artifacts_run_id: ${{ steps.reuse.outputs.run_id }}
    steps:
      - name: Validate public publication recovery rules
        uses: actions/checkout@v4
        with:
          path: .release-policy
          persist-credentials: false
      - run: node --test .release-policy/scripts/release.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.SOURCE_REPO_DEPLOY_KEY }}
          persist-credentials: false
      - name: Validate tag and skip an already published scheduled release
        id: source
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const tag = process.env.REQUESTED_TAG || `v${JSON.parse(readFileSync('package.json', 'utf8')).version}`;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected a stable version tag');
          const commit = execFileSync('git', ['rev-parse', '--verify', `refs/tags/${tag}^{commit}`], { encoding: 'utf8' }).trim();
          let build = true;
          if (process.env.GITHUB_EVENT_NAME === 'schedule') {
            const response = await fetch(`https://api.github.com/repos/${process.env.RELEASE_REPO}/releases/tags/${tag}`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
            });
            if (response.ok) build = false;
            else if (response.status !== 404) throw new Error(`Release lookup failed: ${response.status}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\ncommit=${commit}\nbuild=${build}\n`);
          console.log(build ? `Building ${tag} (${commit})` : `${tag} is already published`);
          NODE
      - name: Validate an optional verified artifact recovery run
        id: reuse
        if: inputs.artifacts_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const runId = process.env.ARTIFACTS_RUN_ID;
          if (!/^\d+$/.test(runId)) throw new Error('Invalid artifact run ID');
          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024 });
          const root = `repos/${process.env.GITHUB_REPOSITORY}`;
          const run = JSON.parse(gh('api', `${root}/actions/runs/${runId}`));
          if (run.status !== 'completed' || run.event !== 'workflow_dispatch' || !run.path.endsWith('/release.yml')) throw new Error('Recovery requires a completed standard release run');
          const jobs = JSON.parse(gh('api', `${root}/actions/runs/${runId}/jobs?per_page=100`)).jobs;
          for (const name of ['Build windows-x86_64', 'Build linux-x86_64', 'Build darwin-x86_64', 'Build darwin-aarch64']) {
            if (!jobs.some(job => job.name === name && job.conclusion === 'success')) throw new Error(`Missing successful ${name}`);
          }
          const prepare = jobs.find(job => job.name === 'Resolve private source release tag' && job.conclusion === 'success');
          if (!prepare) throw new Error('Missing successful source resolution');
          const log = gh('api', `${root}/actions/jobs/${prepare.id}/logs`, '--allow-escape-sequences');
          if (!log.includes(`Building ${process.env.SOURCE_TAG} (${process.env.SOURCE_COMMIT})`)) throw new Error('Artifacts do not match the exact private source commit');
          const artifacts = JSON.parse(gh('api', `${root}/actions/runs/${runId}/artifacts?per_page=100`)).artifacts;
          for (const platform of ['windows-x86_64', 'linux-x86_64', 'darwin-x86_64', 'darwin-aarch64']) {
            if (!artifacts.some(artifact => artifact.name === `release-${platform}` && !artifact.expired)) throw new Error(`Missing artifact ${platform}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `run_id=${runId}\n`);
          console.log(`Revalidating signed artifacts from ${runId} for ${process.env.SOURCE_TAG}`);
          NODE

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true' && needs.prepare.outputs.artifacts_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: ""
            bundle_root: src-tauri/target/release/bundle
            bundles: nsis
          - platform: darwin-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundle_root: src-tauri/target/x86_64-apple-darwin/release/bundle
            bundles: app,dmg
          - platform: darwin-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            bundle_root: src-tauri/target/aarch64-apple-darwin/release/bundle
            bundles: app,dmg
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_root: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout private source tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.prepare.outputs.commit }}
          ssh-key: ${{ secrets.SOURCE_REPO_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 17
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout 5s getent ahostsv4 azure.archive.ubuntu.com >/dev/null; then
            # Recover only this fixed archive hostname when runner DNS fails.
            # HTTPS certificate and Ubuntu archive signature checks stay enabled.
            curl --resolve cloudflare-dns.com:443:1.1.1.1 \
              --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
              -H 'Accept: application/dns-json' \
              'https://cloudflare-dns.com/dns-query?name=azure.archive.ubuntu.com&type=A' \
              -o "$RUNNER_TEMP/ubuntu-dns.json"
            python3 - "$RUNNER_TEMP/ubuntu-dns.json" > "$RUNNER_TEMP/ubuntu-hosts" <<'PY'
          import ipaddress, json, sys
          hostname = 'azure.archive.ubuntu.com'
          with open(sys.argv[1], encoding='utf-8') as source:
              answer = json.load(source)
          if answer.get('Status') != 0 or not any(q.get('name', '').rstrip('.') == hostname and q.get('type') == 1 for q in answer.get('Question', [])):
              raise SystemExit('Ubuntu archive DNS lookup failed')
          addresses = []
          for item in answer.get('Answer', []):
              if item.get('type') == 1:
                  ip = ipaddress.ip_address(item['data'])
                  if ip.version != 4 or not ip.is_global:
                      raise SystemExit('Invalid Ubuntu archive address')
                  addresses.append(str(ip))
          if not addresses:
              raise SystemExit('No Ubuntu archive IPv4 address')
          for address in dict.fromkeys(addresses):
              print(f'{address} {hostname}')
          PY
            sudo tee -a /etc/hosts < "$RUNNER_TEMP/ubuntu-hosts" >/dev/null
          fi
          source_list="$RUNNER_TEMP/oneyes-ubuntu.sources.list"
          cat > "$source_list" <<'APT'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          APT
          apt_options=(
            -o "Dir::Etc::sourcelist=$source_list"
            -o "Dir::Etc::sourceparts=-"
            -o "Acquire::Retries=2"
            -o "Acquire::http::Timeout=20"
            -o "Acquire::https::Timeout=20"
            -o "APT::Update::Error-Mode=any"
          )
          sudo timeout --signal=TERM --kill-after=30s 5m apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=30s 10m apt-get "${apt_options[@]}" install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev \
            patchelf rpm file xvfb dbus-x11
      - run: npm ci
      - name: Validate source version and release tag
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: npm run release:version
      - name: Validate release tooling
        run: npm run test:release
      - name: Test desktop logic
        run: npm test
      - name: Install Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Validate Tauri signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo '::error::Missing TAURI_SIGNING_PRIVATE_KEY'; exit 1; }
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" || { echo '::error::Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD'; exit 1; }
      - name: Validate Sparkle signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          test -n "${SPARKLE_PRIVATE_KEY:-}" || { echo '::error::Missing SPARKLE_PRIVATE_KEY'; exit 1; }
          test -n "${SPARKLE_PUBLIC_ED_KEY:-}" || { echo '::error::Missing SPARKLE_PUBLIC_ED_KEY'; exit 1; }
      - name: Download Sparkle 2 framework and tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sparkle_version="2.9.6"
          sparkle_sha256="52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/Sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-$sparkle_version.tar.xz"
          printf '%s  %s\n' "$sparkle_sha256" "$RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          cp -R "$RUNNER_TEMP/sparkle/Sparkle.framework" "$GITHUB_WORKSPACE/src-tauri/Sparkle.framework"
          cp -R "$RUNNER_TEMP/sparkle/bin" "$GITHUB_WORKSPACE/src-tauri/sparkle-bin"
          chmod +x "$GITHUB_WORKSPACE/src-tauri/sparkle-bin"/*
      - name: Configure Sparkle public key
        if: runner.os == 'macOS'
        shell: bash
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          test "$SPARKLE_PUBLIC_ED_KEY" = "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' src-tauri/Info.plist)"
          feed="appcast-darwin-x86_64.xml"
          [[ "${{ matrix.platform }}" == "darwin-aarch64" ]] && feed="appcast-darwin-aarch64.xml"
          /usr/libexec/PlistBuddy -c "Set :SUFeedURL https://github.com/${{ env.RELEASE_REPO }}/releases/latest/download/$feed" src-tauri/Info.plist
      - name: Test Linux backend
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Verify macOS credentials do not depend on Keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked --manifest-path src-tauri/Cargo.toml --target "${{ matrix.target }}" --prefix none -e normal > "$RUNNER_TEMP/macos-dependencies.txt"
          if grep -Eq '^keyring v' "$RUNNER_TEMP/macos-dependencies.txt"; then
            echo '::error::The macOS credential backend must not depend on keyring.'
            exit 1
          fi
      - name: Test macOS local credentials and encrypted session restart
        if: runner.os == 'macOS'
        env:
          SPARKLE_FRAMEWORK_PATH: ${{ github.workspace }}/src-tauri
          DYLD_FRAMEWORK_PATH: ${{ github.workspace }}/src-tauri
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Verify official Codex desktop HTTP compatibility
        if: matrix.platform == 'darwin-aarch64' && hashFiles('scripts/test-codex-desktop-compat.mjs') != ''
        env:
          SPARKLE_FRAMEWORK_PATH: ${{ github.workspace }}/src-tauri
          DYLD_FRAMEWORK_PATH: ${{ github.workspace }}/src-tauri
        run: node scripts/test-codex-desktop-compat.mjs
      - name: Prepare Windows publisher signing
        if: runner.os == 'Windows'
        env:
          WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: node scripts/release-signing.mjs prepare
      - name: Prepare macOS publisher signing
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release-signing.mjs prepare
      - name: Prepare Linux OTA signing
        if: runner.os == 'Linux'
        run: node scripts/release-signing.mjs prepare
      - name: Import trusted Windows code-signing certificate
        if: runner.os == 'Windows' && env.ONEYES_SIGNING_MODE == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: ./scripts/windows-signing.ps1 -Action Prepare
      - name: Build signed Tauri bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_FRAMEWORK_PATH: ${{ github.workspace }}/src-tauri
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ "$ONEYES_SIGNING_MODE" != developer-id ]]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          if [[ -n "${{ matrix.target }}" ]]; then
            npm run tauri build -- --target "${{ matrix.target }}" --config "$ONEYES_SIGNING_CONFIG" --bundles "${{ matrix.bundles }}" -- --locked
          else
            npm run tauri build -- --config "$ONEYES_SIGNING_CONFIG" --bundles "${{ matrix.bundles }}" -- --locked
          fi
      - name: Verify Windows publisher and timestamp
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: ./scripts/windows-signing.ps1 -Action Verify -BundleRoot "${{ matrix.bundle_root }}"
      - name: Verify macOS publisher and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/macos-signing.mjs "${{ matrix.bundle_root }}" "${{ matrix.platform }}"
      - name: Verify Windows executable and live application icons
        if: runner.os == 'Windows'
        env:
          WINDOWS_ICON_TEST_EXE: src-tauri/target/release/oneyes-desktop.exe
        run: npm run test:release
      - name: Verify packaged macOS icon and code signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "${{ matrix.bundle_root }}/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          icon="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")"
          [[ "$icon" == *.icns ]] || icon="$icon.icns"
          cmp src-tauri/icons/icon.icns "$app/Contents/Resources/$icon"
          codesign --verify --deep --strict --verbose=2 "$app"
          details="$(codesign --display --verbose=4 "$app" 2>&1)"
          grep -q 'Identifier=ai.oneyes.desktop' <<<"$details"
          grep -Eq 'Signature=adhoc|Authority=Developer ID Application:' <<<"$details"
      - name: Smoke test packaged macOS Sparkle startup
        if: runner.os == 'macOS'
        shell: bash
        run: python3 scripts/smoke-macos-sparkle.py "${{ matrix.bundle_root }}/macos/OneYes.app"
      - name: Smoke test Linux startup
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          set +e
          dbus-run-session -- xvfb-run -a timeout 15s src-tauri/target/${{ matrix.target }}/release/oneyes-desktop
          result=$?
          if [[ "$result" -ne 124 ]]; then
            echo "::error::Linux app exited during the startup smoke test (exit $result)."
            exit 1
          fi
      - name: Collect and verify updater files
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          output="release/${{ matrix.platform }}"
          mkdir -p "$output"
          find "${{ matrix.bundle_root }}" -type f \( -name '*.sig' -o -name '*.app.tar.gz' -o -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} "$output/" \;
          if [[ "${{ matrix.platform }}" == windows-* ]]; then
            test -n "$(find "$output" -maxdepth 1 -type f -name '*.exe.sig' -print -quit)"
            test -n "$(find "$output" -maxdepth 1 -type f -name '*.exe' -print -quit)"
          elif [[ "${{ matrix.platform }}" == linux-* ]]; then
            for extension in AppImage deb rpm; do
              test -n "$(find "$output" -maxdepth 1 -type f -name "*.$extension.sig" -print -quit)"
              test -n "$(find "$output" -maxdepth 1 -type f -name "*.$extension" -print -quit)"
            done
          else
            test -n "$(find "$output" -maxdepth 1 -type f -name '*.app.tar.gz.sig' -print -quit)"
            test -n "$(find "$output" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
            updater="$(find "$output" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
            mv "$updater" "$output/OneYes_${{ matrix.platform }}.app.tar.gz"
            mv "$updater.sig" "$output/OneYes_${{ matrix.platform }}.app.tar.gz.sig"
            dmg="$(find "$output" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            test -n "$dmg"
            sparkle_file="$output/OneYes_${{ matrix.platform }}.dmg"
            mv "$dmg" "$sparkle_file"
            sparkle_key_file="$RUNNER_TEMP/sparkle-private-key"
            printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$sparkle_key_file"
            chmod 600 "$sparkle_key_file"
            trap 'rm -f "$sparkle_key_file"' EXIT
            sparkle_signature="$("$GITHUB_WORKSPACE/src-tauri/sparkle-bin/sign_update" "$sparkle_file" -f "$sparkle_key_file" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
            test -n "$sparkle_signature"
            sparkle_length="$(stat -f '%z' "$sparkle_file")"
            printf '{"file":"%s","signature":"%s","length":%s}\n' "$(basename "$sparkle_file")" "$sparkle_signature" "$sparkle_length" > "$output/sparkle.json"
          fi
      - name: Verify OTA cryptography and record publisher status
        run: node scripts/release-signing.mjs report "${{ matrix.platform }}"
      - name: Remove imported Windows certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-signing.ps1 -Action Cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release
          if-no-files-found: error

  publish:
    name: Publish to public release repository
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.build == 'true' && (needs.build.result == 'success' || needs.prepare.outputs.artifacts_run_id != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout private source tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.prepare.outputs.commit }}
          ssh-key: ${{ secrets.SOURCE_REPO_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source version and release tag
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: npm run release:version
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.artifacts_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify build output
        run: npm run release:assets
      - name: Verify complete signing inventory
        run: node scripts/release-signing.mjs summary
      - name: Build cross-version OTA deltas
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REPO: ${{ env.RELEASE_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          npm run release:deltas
      - name: Build updater manifest
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REPO: ${{ env.RELEASE_REPO }}
        shell: bash
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          notes="docs/releases/$tag.zh-CN.md"
          if [[ -f "$notes" ]]; then export RELEASE_NOTES="$(cat "$notes")"; fi
          node scripts/build-update-manifest.mjs
      - name: Build Sparkle 2 appcast
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REPO: ${{ env.RELEASE_REPO }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          notes="docs/releases/$tag.zh-CN.md"
          if [[ -f "$notes" ]]; then export RELEASE_NOTES="$(cat "$notes")"; fi
          node scripts/build-sparkle-appcast.mjs
      - name: Validate updater manifest
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REQUIRED_PLATFORMS: ${{ env.REQUIRED_PLATFORMS }}
        run: npm run release:validate
      - name: Publish assets to this public repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ env.RELEASE_REPO }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release -mindepth 2 -maxdepth 2 -type f ! -name 'sparkle.json' ! -name 'incremental-*.json' ! -name 'signing-*.json' -print | sort)
          files+=(release/signing-status.json release/latest.json release/appcast-darwin-x86_64.xml release/appcast-darwin-aarch64.xml)
          test "${#files[@]}" -ge 18
          # Upload into a draft; a failed upload never changes the public OTA.
          if ! gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            notes="docs/releases/$RELEASE_TAG.zh-CN.md"
            if [[ -f "$notes" ]]; then
              gh release create "$RELEASE_TAG" --draft --repo "$RELEASE_REPO" --title "OneYes Desktop $RELEASE_TAG" --notes-file "$notes"
            else
              gh release create "$RELEASE_TAG" --draft --repo "$RELEASE_REPO" --title "OneYes Desktop $RELEASE_TAG" --notes "跨平台安装包与 OTA 更新清单。"
            fi
          fi
          draft="$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json isDraft --jq .isDraft)"
          if [[ "$draft" == true ]]; then
            for file in "${files[@]}"; do
              uploaded=false
              for attempt in 1 2 3; do
                if gh release upload "$RELEASE_TAG" "$file" --repo "$RELEASE_REPO" --clobber; then uploaded=true; break; fi
                sleep "$((attempt * 2))"
              done
              [[ "$uploaded" == true ]] || exit 1
            done
          fi
          # Refuse duplicate names, missing assets or size/digest mismatches.
          # Already published versions are verified and never overwritten.
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json assets > "$RUNNER_TEMP/oneyes-published-assets.json"
          node --input-type=module - "$RUNNER_TEMP/oneyes-published-assets.json" "${files[@]}" <<'NODE'
          import { readFileSync, statSync } from 'node:fs';
          import { basename } from 'node:path';
          import { createHash } from 'node:crypto';
          const [inventory, ...files] = process.argv.slice(2);
          const assets = JSON.parse(readFileSync(inventory, 'utf8')).assets;
          if (new Set(files.map(file => basename(file))).size !== files.length || assets.length !== files.length) throw new Error('Release asset count mismatch');
          for (const file of files) {
            const asset = assets.find(asset => asset.name === basename(file));
            if (!asset || asset.size !== statSync(file).size) throw new Error(`Missing or incomplete ${basename(file)}`);
            if (asset.digest && asset.digest !== `sha256:${createHash('sha256').update(readFileSync(file)).digest('hex')}`) throw new Error(`Digest mismatch ${basename(file)}`);
          }
          NODE
          if [[ "$draft" == true ]]; then
            gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --draft=false --latest
          fi
      - name: Label release systems and installer downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ env.RELEASE_REPO }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/label-github-releases.mjs
